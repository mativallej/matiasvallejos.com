<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="El valor no se genera acumulando. Se genera compartiendo.">
  <rect width="1200" height="300" fill="#080706"/>
  <rect x="72" y="72" width="6" height="156" rx="3" fill="#E8742A"/>
  <text x="112" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#FAFAF9">El valor no se genera acumulando.</text>
  <text x="112" y="218" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#FB923C">Se genera compartiendo.</text>
</svg>
