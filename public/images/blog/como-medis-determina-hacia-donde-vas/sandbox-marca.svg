<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="El logo de Tegu encerrado en un sandbox: un recuadro chico donde el error puede pasar, dentro de un recuadro grande que es la marca. Equivocate acá adentro; lo que se sale, se come la marca.">
  <defs><clipPath id="tileC"><rect x="534" y="234" width="132" height="132" rx="30"/></clipPath></defs>
  <rect width="1200" height="600" fill="#080706"/>
  <rect x="24" y="24" width="1152" height="552" rx="20" fill="none" stroke="#3D3935" stroke-width="1.5"/>
  <text x="64" y="84" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="22" letter-spacing="3" fill="#57534E">SANDBOX · EL TAMAÑO DEL ERROR</text>

  <!-- la marca: el perímetro que no se toca -->
  <rect x="90" y="140" width="1020" height="320" rx="24" fill="none" stroke="#3D3935" stroke-width="2"/>
  <rect x="500" y="122" width="200" height="36" fill="#080706"/>
  <text x="600" y="147" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" letter-spacing="3" fill="#78716C">LA MARCA</text>

  <!-- el sandbox: donde el error sí puede pasar -->
  <rect x="420" y="196" width="360" height="208" rx="18" fill="none" stroke="#FB923C" stroke-width="2.5" stroke-dasharray="9 9"/>
  <rect x="530" y="382" width="140" height="34" fill="#080706"/>
  <text x="600" y="406" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" letter-spacing="3" fill="#FB923C">SANDBOX</text>

  <!-- errores, contenidos -->
  <g stroke="#F87171" stroke-width="3.5" stroke-linecap="round">
    <path d="M452,232 l20,20 M472,232 l-20,20"/>
    <path d="M728,240 l20,20 M748,240 l-20,20"/>
    <path d="M456,338 l20,20 M476,338 l-20,20"/>
    <path d="M724,344 l20,20 M744,344 l-20,20"/>
  </g>

  <image href="data:image/png;base64," x="534" y="234" width="132" height="132" clip-path="url(#tileC)"/>

  <text x="600" y="516" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="22" letter-spacing="1" fill="#57534E">Equivocate acá adentro. Lo que se sale, se come la marca.</text>
</svg>
