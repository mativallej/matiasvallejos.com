<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Un renglón del panel de Tegu: donde iba la persona dice Usuario eliminado y deleted_3801 arroba deleted.local; al lado, el trabajo, Reparación de horno a gas en cocina, Técnico de Gas. El registro queda; el que lo hizo, no.">
