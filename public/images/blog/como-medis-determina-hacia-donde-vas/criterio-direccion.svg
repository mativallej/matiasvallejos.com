<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Qué se delega y qué no. A la izquierda, la IA se queda con la forma: el hacer, el ordenar, el redactar, el prototipo, traer los datos. A la derecha, vos con la sustancia: la hipótesis, qué se mide y por qué, el umbral, el criterio, la decisión. Si delegás cómo medís, delegás hacia dónde vas.">
  <defs>
    <path id="st" d="M0,-11 L2.7,-3.72 L10.46,-3.4 L4.37,1.42 L6.47,8.9 L0,4.6 L-6.47,8.9 L-4.37,1.42 L-10.46,-3.4 L-2.7,-3.72 Z"/>
    <clipPath id="iaTile"><rect x="96" y="154" width="96" height="96" rx="22"/></clipPath>
  </defs>
  <rect width="1200" height="700" fill="#080706"/>
  <rect x="24" y="24" width="1152" height="652" rx="20" fill="none" stroke="#3D3935" stroke-width="1.5"/>
  <text x="64" y="84" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="22" letter-spacing="3" fill="#57534E">QUÉ SE DELEGA · QUÉ NO</text>

  <!-- la IA: la forma -->
  <rect x="64" y="126" width="504" height="470" rx="16" fill="#12100E" stroke="#3D3935" stroke-width="1.5"/>
  <image href="data:image/png;base64," x="96" y="154" width="96" height="96" clip-path="url(#iaTile)"/>
  <text x="96" y="306" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="26" letter-spacing="3" fill="#A8A29E">LA IA</text>
  <text x="96" y="338" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" letter-spacing="3" fill="#57534E">LA FORMA</text>
  <line x1="96" y1="360" x2="536" y2="360" stroke="#3D3935" stroke-width="1.5"/>
  <circle cx="98" cy="394" r="4" fill="#3D3935"/>
  <text x="122" y="402" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#78716C">el hacer</text>
  <circle cx="98" cy="432" r="4" fill="#3D3935"/>
  <text x="122" y="440" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#78716C">el ordenar</text>
  <circle cx="98" cy="470" r="4" fill="#3D3935"/>
  <text x="122" y="478" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#78716C">el redactar y el resumir</text>
  <circle cx="98" cy="508" r="4" fill="#3D3935"/>
  <text x="122" y="516" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#78716C">el prototipo</text>
  <circle cx="98" cy="546" r="4" fill="#3D3935"/>
  <text x="122" y="554" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#78716C">traer los datos</text>

  <!-- vos: la sustancia -->
  <rect x="632" y="126" width="504" height="470" rx="16" fill="#12100E" stroke="#FB923C" stroke-width="1.5"/>
  <rect x="664" y="154" width="96" height="96" rx="22" fill="#1C1917" stroke="#FB923C" stroke-width="1.5"/>
  <use href="#st" transform="translate(712,202) scale(3.1)" fill="#FB923C"/>
  <text x="664" y="306" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="26" letter-spacing="3" fill="#FAFAF9">VOS</text>
  <text x="664" y="338" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" letter-spacing="3" fill="#FB923C">LA SUSTANCIA</text>
  <line x1="664" y1="360" x2="1104" y2="360" stroke="#3D3935" stroke-width="1.5"/>
  <circle cx="666" cy="394" r="4" fill="#FB923C"/>
  <text x="690" y="402" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#E7E5E4">la hipótesis</text>
  <circle cx="666" cy="432" r="4" fill="#FB923C"/>
  <text x="690" y="440" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#E7E5E4">qué se mide y por qué</text>
  <circle cx="666" cy="470" r="4" fill="#FB923C"/>
  <text x="690" y="478" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#E7E5E4">el umbral</text>
  <circle cx="666" cy="508" r="4" fill="#FB923C"/>
  <text x="690" y="516" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#E7E5E4">el criterio</text>
  <circle cx="666" cy="546" r="4" fill="#FB923C"/>
  <text x="690" y="554" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#E7E5E4">la decisión</text>

  <text x="600" y="654" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="22" letter-spacing="1" fill="#FB923C">Si delegás cómo medís, delegás hacia dónde vas.</text>
</svg>
